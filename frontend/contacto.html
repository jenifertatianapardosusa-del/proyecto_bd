<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Tienda — Contacto</title>

    <!-- Fuente moderna -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="contacto.css" />
</head>
<body>

    <!-- ===== BARRA DE NAVEGACIÓN (NAVBAR) ===== -->
    <header class="navbar">
        <div class="contenedor nav-contenido">
            <a href="index.html" class="logo">Mi<strong>Tienda</strong></a>
            <nav class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="#productos">Productos</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </div>
    </header>

    <!-- ===== CONTENIDO PRINCIPAL ===== -->
    <main class="contenedor" id="inicio">
        <div class="encabezado-principal">
            <h1>Sistema de Gestión de Mensajes</h1>
            <p>¿Tienes dudas o sugerencias? Déjanos un mensaje</p>
        </div>

        <div class="panel-tienda">
            <!-- SECCIÓN 1: Formulario de Mensajes -->
            <section class="tarjeta" id="registro">
                <h2 id="tituloFormulario">Envíanos un mensaje</h2>

                <form id="formularioMensaje">
                    <input type="hidden" id="mensajeId" value="" />
                    
                    <section class="form-ajuste">
                        <div class="campo-ajuste">
                            <label for="nombre">Nombre completo:</label>
                            <input type="text" id="nombre" placeholder="Ej: Juliana Perez" required />
                        </div>

                        <div class="campo-ajuste">
                            <label for="email">Correo electrónico:</label>
                            <input type="email" id="email" placeholder="Ej: julianaperez@gmail.com" required />
                        </div>
                    </section>

                    <div class="campo-ajuste">
                        <label for="asunto">Asunto:</label>
                        <input type="text" id="asunto" placeholder="Ej: Devolucion de dinero" required />
                    </div>

                    <div class="campo-ajuste">
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" placeholder="Escribe los detalles aquí:" rows="4" required></textarea>
                    </div>
           
                    <div class="acciones-form">
                        <button type="submit" id="btnEnviar" class="btn btn-guardar">Enviar mensaje</button>
                    </div>
                </form>
            </section>

            <!-- SECCIÓN 2: Lista de Mensajes -->
            <section class="tarjeta" id="mensajes">
                <h2>Mensajes Recibidos (Consulta GET)</h2>
                <div id="listaMensajes" class="lista-productos">

                </div>
            </section>
        </div>
    </main>

    <!-- ===== PIE DE PÁGINA (FOOTER) ===== -->
    <footer class="footer">
        <div class="contenedor footer-contenido">
            <p>&copy; 2026 Mi Tienda — Proyecto Formativo con Node.js, Express y MySQL.</p>
        </div>
    </footer>

    <script src="contacto.js"></script>
</body>
</html>
